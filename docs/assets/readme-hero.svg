      <polygon points="5,4.61 9.05,8.66 5,12.71 .95,8.66"/>
      <polygon points="0,13.27 4.05,17.32 0,21.37 -4.05,17.32"/>
      <polygon points="10,13.27 14.05,17.32 10,21.37 5.95,17.32"/>
      <polygon points="20,13.27 24.05,17.32 20,21.37 15.95,17.32"/>
