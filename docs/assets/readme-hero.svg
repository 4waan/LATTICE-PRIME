    <text x="87" y="49" fill="#f3f4ff" font-size="20" font-weight="700">Lattice Prime</text>
    <rect x="231" y="30" width="92" height="25" rx="12.5" fill="#2e254d"/>
    <text x="277" y="47" text-anchor="middle" fill="#c4b5fd" font-size="10" letter-spacing="1.6">TESTNET</text>
    <text x="54" y="111" fill="#aab3ce" font-size="12" letter-spacing="2">THE WEB APP FOR YOUR NEXT MOVE</text>
    <text x="52" y="166" fill="#f3f4ff" font-size="43" font-weight="700" letter-spacing="-1.3">A market you can use.</text>
    <text x="52" y="218" fill="url(#accent)" font-size="43" font-weight="700" letter-spacing="-1.3">A record you can verify.</text>
    <text x="54" y="258" fill="#c0c7dc" font-size="17">Sealed orders. Proven eligibility. Accountable publication.</text>
    <rect x="54" y="287" width="235" height="43" rx="21.5" fill="#8b5cf6"/>
    <text x="171" y="314" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Open the web app  ↗</text>
