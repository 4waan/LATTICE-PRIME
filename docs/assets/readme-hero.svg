    <text x="491" y="391" fill="#d6d9eb" font-size="14">Eligibility</text>
    <text x="640" y="391" fill="#d6d9eb" font-size="14">Issuer</text>
    <text x="1146" y="391" text-anchor="end" fill="#9ca5c4" font-size="12">BUILT ON HEDERA</text>
