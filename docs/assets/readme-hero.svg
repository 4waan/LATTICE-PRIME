    <line x1="54" y1="359" x2="1146" y2="359" stroke="#37374e"/>
    <text x="54" y="391" fill="#d6d9eb" font-size="14">Markets</text>
    <text x="193" y="391" fill="#d6d9eb" font-size="14">Portfolio</text>
