<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Lattice Prime. A market you can use. A record you can verify.</title>
  <desc id="desc">The Lattice Prime web app at lattice-prime.vercel.app. Explore Markets, Portfolio, Financing, Eligibility, and Issuer. Indigo lattice branding matches the application.</desc>
  <defs>
