[profile.default]
src          = "src"
out          = "out"
libs         = ["lib"]
test         = "test"
script       = "script"
solc         = "0.8.24"
optimizer    = true
optimizer_runs = 200
via_ir       = false
# ATS facets sit at ~97% of EIP-170; we measure size every build instead of
# allowUnlimitedContractSize.
bytecode_hash = "none"
# Proof fixtures (seam D) and docs/RULEBOOK.md (rulebook hash).
fs_permissions = [
    {access = "read", path = "./test/fixtures"},
    {access = "read", path = "./docs/RULEBOOK.md"},
]

[rpc_endpoints]
hedera_testnet = "${HEDERA_TESTNET_RPC}"

[profile.default.fuzz]
runs = 512

[profile.financing]
# RepoVault v5 carries the complete lifecycle and sits just over EIP-170 with
# the throughput-oriented default. This deployment profile optimizes for size.
optimizer_runs = 1

[fmt]
line_length = 96
tab_width = 4
bracket_spacing = false

[lint]
# Immutables here are public getters and read as ordinary accessors at every call
# site, including from the ATS side. SCREAMING_SNAKE would make `registry.EPOCH_ZERO()`
# the public API, which reads as a constant and is not one.
exclude_lints = [
    "screaming-snake-case-immutable",
    # `commitmentOf` hashes a six field preimage once per call, off the hot path.
    # Hand written assembly here would save a few hundred gas and make the one
    # function a client has to reproduce exactly harder to read, which is the
    # wrong trade for a preimage the client and the contract must agree on.
    "asm-keccak256",
]
